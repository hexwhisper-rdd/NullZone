
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090710">
  <meta name="description" content="NULLZONE — Music, lyrics, games, apps, videos and underground entertainment.">
  <title>NULLZONE — No Signal. No Limits.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090710;
      color: #f8f2ff;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a {
      color: #d7aeff;
      text-decoration: none;
    }

    .wrap {
      width: 92%;
      max-width: 900px;
      margin: auto;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid #39254e;
      background: #100a19;
    }

    .logo {
      color: #c58bff;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .tagline {
      color: #b7a8c5;
      font-size: 11px;
    }

    nav {
      margin-top: 14px;
    }

    nav a {
      display: inline-block;
      margin-right: 14px;
      font-size: 13px;
    }

    .hero {
      padding: 45px 0;
      background: #140b20;
      border-bottom: 1px solid #39254e;
    }

    .status {
      color: #c58bff;
      font-size: 12px;
      font-family: monospace;
    }

    h1 {
      font-size: 42px;
      line-height: 1.15;
    }

    h1 span {
      color: #c58bff;
    }

    .intro {
      color: #b7a8c5;
      max-width: 550px;
    }

    .button {
      display: inline-block;
      padding: 10px 15px;
      margin-top: 12px;
      background: #c58bff;
      color: #160923;
      font-weight: bold;
      border-radius: 4px;
    }

    .section {
      padding: 25px 0;
    }

    h2 {
      font-size: 22px;
    }

    .muted {
      color: #b7a8c5;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="logo">[ NULLZONE ]</div>
      <div class="tagline">THE UNDERGROUND DIGITAL NETWORK</div>

      <nav>
        <a href="#explore">Explore</a>
        <a href="#latest">Latest</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <div class="status">[ SYSTEM ONLINE // ACCESS GRANTED ]</div>

      <h1>NO SIGNAL.<br>
        <span>NO LIMITS.</span>
      </h1>

      <p class="intro">
        Your next sound. Your next game. Your next obsession.
        Discover music, lyrics, games, apps, videos and more
        in one underground corner of the internet.
      </p>

      <a class="button" href="#explore">[ ENTER NULLZONE ]</a>
    </div>
  </section>
</body>
</html>
